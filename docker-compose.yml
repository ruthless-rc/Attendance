version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./attendance.db
      - SECRET_KEY=change-me-in-production-use-a-long-random-string
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - RECOGNITION_THRESHOLD=0.35
      - DUPLICATE_INTERVAL_SECONDS=86400
      - LATE_THRESHOLD_HOUR=9
    volumes:
      - ./backend/attendance.db:/app/attendance.db
      - ./backend/app/recognition/models:/app/app/recognition/models
    ports:
      - "8000:8000"
    networks:
      - attendance-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - attendance-net

networks:
  attendance-net:
    driver: bridge
